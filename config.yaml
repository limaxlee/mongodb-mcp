server_port: 8446
mongodb_host: gtrai.sec.samsung.net
mongodb_port: 27017
mongodb_db_name: cosmoData

# Tunables of the data drift analysis, every value is echoed back in the analysis result
data_drift:
  # Range limits: total span of both windows and the number of periods the automatic granularity aims for
  max_total_days: 400
  max_periods: 60

  # Minimum predictions (boxes for detection) on each side of a split before divergence measures are trusted
  min_side_records_cls: 500
  min_side_records_det: 300
  min_side_boxes: 300

  # Minimum number of periods for the change point search and on each side of a split
  min_periods_changepoint: 4
  min_segment_periods: 2

  # Divergence thresholds
  eps: 0.0001
  psi_moderate: 0.10
  psi_significant: 0.25
  chi2_p: 0.001
  class_prop_change: 0.05
  threshold_pressure_ratio: 2.0
  threshold_pressure_abs: 0.02

  # Misc
  decimals: 4
